[project]
name = "reelforge"
version = "0.2.0"
description = "End-to-end short-form video automation: A-Roll/B-Roll segmentation, AI generation, captioning, and multi-platform publishing"
authors = [{ name = "dawarazhar11", email = "mdawar.azhar@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    # ── Core framework ────────────────────────────────────────────────
    "streamlit>=1.40.0",

    # ── Validation, config, logging (ported from Pixelle) ─────────────
    "pydantic>=2.0.0",
    "loguru>=0.7.0",
    "pyyaml>=6.0.0",
    "tenacity>=8.2.0",
    "python-dotenv>=1.0.0",

    # ── HTTP / async (ported from Pixelle) ────────────────────────────
    "httpx>=0.28.1",
    "requests>=2.28.1",
    "websocket-client>=1.6.0",
    "certifi>=2025.10.5",

    # ── LLM (multi-provider via OpenAI-compatible) ────────────────────
    "openai>=2.6.0",

    # ── TTS (Edge-TTS for free A-Roll fallback) ───────────────────────
    "edge-tts==7.2.7",

    # ── ComfyUI workflow execution (ported from Pixelle) ──────────────
    "comfykit>=0.1.12",

    # ── Replicate cloud models (ReelForge unique) ─────────────────────
    "replicate>=0.25.0",

    # ── Video / media processing ──────────────────────────────────────
    "moviepy==1.0.3",
    "ffmpeg-python>=0.2.0",
    "imageio-ffmpeg>=0.4.8",
    "opencv-python>=4.7.0",
    "pillow>=10.0.0,<12",
    "pydub>=0.25.1",

    # ── HTML → video frame rendering (ported from Pixelle) ────────────
    "playwright>=1.58.0",
    "jinja2>=3.1.0",
    "beautifulsoup4>=4.14.2",

    # ── Caption transcription (ReelForge unique) ──────────────────────
    "openai-whisper>=20231117",
    "vosk>=0.3.45",

    # ── Data / display ────────────────────────────────────────────────
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",

    # ── Optional API surface (ported from Pixelle) ────────────────────
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",

    # ── Social media publishing (ReelForge unique) ────────────────────
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",

    # ── HeyGen avatar (ReelForge unique) - uses requests ──────────────

    # ── Streamlit dev ─────────────────────────────────────────────────
    "watchdog>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.6.0",
    "mypy>=1.8.0",
    "types-requests",
    "types-PyYAML",
    "pre-commit>=3.6.0",
]

[project.scripts]
reelforge = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["app/utils/video/captions.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"app/pages/*.py" = ["E402"]  # streamlit pages do imports after set_page_config

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests/unit"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
