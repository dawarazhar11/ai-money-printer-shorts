name: tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The unit suite intentionally avoids the heavy media stack (moviepy,
      # opencv, whisper, playwright, ffmpeg). Install only what core/services
      # tests actually import so CI stays fast.
      - name: Install minimal test deps
        run: |
          python -m pip install --upgrade pip
          pip install \
            "pydantic>=2.0.0" \
            "pyyaml>=6.0.0" \
            "loguru>=0.7.0" \
            "python-dotenv>=1.0.0" \
            "tenacity>=8.2.0" \
            "pytest>=8.0.0" \
            "pytest-asyncio>=0.23.0" \
            "pytest-mock>=3.12.0"

      - name: Run unit tests
        run: pytest app/tests/unit -v
